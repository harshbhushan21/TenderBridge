<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-label="TenderBridge: agentic bid / no-bid copilot for public tenders">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#11120D"/>
      <stop offset="1" stop-color="#23231D"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#565449" stop-opacity="0"/>
      <stop offset="1" stop-color="#565449" stop-opacity="0.55"/>
    </linearGradient>
    <style>
      .t { font-family: Poppins, "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
      .b { font-family: Montserrat, "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
    </style>
  </defs>

  <rect width="1280" height="340" rx="24" fill="url(#bg)"/>
  <rect x="640" width="640" height="340" rx="24" fill="url(#glow)"/>
  <!-- grid texture -->
  <g stroke="#FDFCF8" stroke-opacity="0.04">
    <path d="M700 0V340M760 0V340M820 0V340M880 0V340M940 0V340M1000 0V340M1060 0V340M1120 0V340M1180 0V340M1240 0V340"/>
    <path d="M640 40H1280M640 100H1280M640 160H1280M640 220H1280M640 280H1280"/>
  </g>

  <!-- logo -->
  <rect x="72" y="74" width="64" height="64" rx="14" fill="#565449"/>
  <g transform="translate(88 88)" fill="none" stroke="#FDFCF8" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20 2H8a3 3 0 0 0-3 3v24a3 3 0 0 0 3 3h18a3 3 0 0 0 3-3V11z"/>
    <path d="M20 2v9h9"/>
    <circle cx="15.5" cy="21" r="4.5"/>
    <path d="m19 24.5 3.5 3.5"/>
  </g>

  <text x="156" y="124" class="t" font-size="54" font-weight="700" fill="#FDFCF8" letter-spacing="-1">TenderBridge</text>
  <text class="b" font-size="21" fill="#D5D4CC">
    <tspan x="74" y="182">An agentic bid / no-bid copilot for public</tspan>
    <tspan x="74" y="210">IT-infrastructure tenders: evidence-backed</tspan>
    <tspan x="74" y="238">decisions, with a human at every gate.</tspan>
  </text>

  <!-- chips -->
  <g class="b" font-size="15" font-weight="600">
    <rect x="74" y="266" width="112" height="34" rx="17" fill="#FDFCF8" fill-opacity="0.08" stroke="#FDFCF8" stroke-opacity="0.18"/>
    <text x="130" y="288" text-anchor="middle" fill="#FDFCF8">LangGraph</text>
    <rect x="196" y="266" width="98" height="34" rx="17" fill="#FDFCF8" fill-opacity="0.08" stroke="#FDFCF8" stroke-opacity="0.18"/>
    <text x="245" y="288" text-anchor="middle" fill="#FDFCF8">FastAPI</text>
    <rect x="304" y="266" width="98" height="34" rx="17" fill="#FDFCF8" fill-opacity="0.08" stroke="#FDFCF8" stroke-opacity="0.18"/>
    <text x="353" y="288" text-anchor="middle" fill="#FDFCF8">Next.js</text>
    <rect x="412" y="266" width="104" height="34" rx="17" fill="#FDFCF8" fill-opacity="0.08" stroke="#FDFCF8" stroke-opacity="0.18"/>
    <text x="464" y="288" text-anchor="middle" fill="#FDFCF8">pgvector</text>
    <rect x="526" y="266" width="92" height="34" rx="17" fill="#FDFCF8" fill-opacity="0.08" stroke="#FDFCF8" stroke-opacity="0.18"/>
    <text x="572" y="288" text-anchor="middle" fill="#FDFCF8">Claude</text>
  </g>

  <!-- pipeline -->
  <g class="b" font-size="15" font-weight="600">
    <rect x="748" y="60" width="224" height="44" rx="10" fill="#FDFCF8"/>
    <text x="860" y="88" text-anchor="middle" fill="#11120D">Tender pack</text>
    <rect x="748" y="132" width="224" height="44" rx="10" fill="#565449"/>
    <text x="860" y="160" text-anchor="middle" fill="#FDFCF8">Requirements + evidence</text>
    <rect x="748" y="204" width="224" height="44" rx="10" fill="#565449"/>
    <text x="860" y="232" text-anchor="middle" fill="#FDFCF8">Rules · score · risks</text>
    <rect x="1010" y="132" width="200" height="44" rx="10" fill="#F59E0B"/>
    <text x="1110" y="160" text-anchor="middle" fill="#11120D">Gate 1 · human decision</text>
    <rect x="1010" y="60" width="96" height="44" rx="10" fill="#16A34A"/>
    <text x="1058" y="88" text-anchor="middle" fill="#FFFFFF">BID</text>
    <rect x="1114" y="60" width="96" height="44" rx="10" fill="#DC2626"/>
    <text x="1162" y="88" text-anchor="middle" fill="#FFFFFF">NO BID</text>
    <rect x="1010" y="204" width="200" height="44" rx="10" fill="#FDFCF8" fill-opacity="0.1" stroke="#FDFCF8" stroke-opacity="0.35" stroke-dasharray="5 4"/>
    <text x="1110" y="232" text-anchor="middle" fill="#FDFCF8">Corrigendum → v2</text>
  </g>
  <g stroke="#D5D4CC" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M860 104v24m-5-6 5 6 5-6"/>
    <path d="M860 176v24m-5-6 5 6 5-6"/>
    <path d="M972 226h16v-72h18m-6-5 6 5-6 5"/>
    <path d="M1110 132v-24m-5 6 5-6 5 6"/>
    <path d="M1110 204v-24m-5 6 5-6 5 6"/>
  </g>
  <text x="748" y="300" class="b" font-size="14" fill="#A2A097">AgentOps 2026 · Track 01 · Multi-agent systems · CGI × MIT Bengaluru</text>
</svg>
