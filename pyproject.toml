[project]
name = "testtbridge"
version = "0.1.0"
description = "TenderBridge: agentic copilot that turns IT-infrastructure tenders into verified compliance checks, bid / no-bid recommendations and cited drafts"
readme = "README.md"
authors = [
    { name = "Harsh Bhushan", email = "harshbhushan21072005@gmail.com" },
    { name = "Swarnim Rai", email = "verantesliving18@gmail.com" },
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.13",
    "celery>=5.4",
    "docling>=2.5",
    "fastapi>=0.115",
    "filetype>=1.2",
    "flagembedding>=1.2",
    "httpx>=0.27",
    "ics>=0.7.2",
    "langchain>=0.3",
    "langchain-anthropic>=0.3",
    "langchain-community>=0.3",
    "langchain-core>=0.3",
    "langchain-google-genai>=2.0",
    "langchain-huggingface>=0.1",
    "langchain-ollama>=0.2",
    "langchain-openai>=0.2",
    "langgraph>=0.2.60",
    "langgraph-checkpoint>=2.0",
    "langgraph-checkpoint-postgres>=2.0",
    "langgraph-checkpoint-sqlite>=2.0",
    "langsmith>=0.1.140",
    "mypy>=1.11",
    "numpy>=1.26",
    "openpyxl>=3.1",
    "pgvector>=0.3",
    "pillow>=10.4",
    "presidio-analyzer>=2.2",
    "presidio-anonymizer>=2.2",
    "psycopg-pool>=3.2",
    "psycopg[binary]>=3.2",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pymupdf>=1.24",
    "pypdf>=4.3",
    "pytesseract>=0.3.10",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "python-dateutil>=2.9",
    "python-docx>=1.1",
    "python-dotenv>=1.0",
    "python-magic>=0.4.27",
    "python-multipart>=0.0.9",
    "rank-bm25>=0.2.2",
    "rapidfuzz>=3.9",
    "redis>=5.0",
    "regex>=2024.7",
    "ruff>=0.6",
    "sentence-transformers>=3.0",
    "sqlalchemy>=2.0.30",
    "sse-starlette>=2.1",
    "structlog>=24.4",
    "tiktoken>=0.7",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
testtbridge = "testtbridge:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
